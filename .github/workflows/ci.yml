name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Wails GUI (gui/) embeds gui/frontend/dist, a build artifact that
      # isn't in the repo and needs node/wails to produce, so it can't build in
      # plain Go CI. All other code lives under cmd/ and internal/; the desktop
      # app is built separately at release time.
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test
        run: go test ./cmd/... ./internal/...
      - name: Build
        run: go build ./cmd/... ./internal/...
