name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The Wails GUI embeds gui/frontend/dist, a build artifact that isn't in
      # the repo and needs node/wails to produce. CI checks the CLI + library
      # packages; the desktop app is built separately at release time.
      - name: Resolve packages (excluding the Wails GUI)
        id: pkgs
        run: echo "list=$(go list ./... | grep -v '/gui' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Vet
        run: go vet ${{ steps.pkgs.outputs.list }}
      - name: Test
        run: go test ${{ steps.pkgs.outputs.list }}
      - name: Build
        run: go build ${{ steps.pkgs.outputs.list }}
