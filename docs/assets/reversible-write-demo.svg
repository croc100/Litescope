.l3{animation:L3 15s linear infinite}
@keyframes L4{0%,26.8%{opacity:0}28.0%,98%{opacity:1}100%{opacity:0}}
.l4{animation:L4 15s linear infinite}
@keyframes L6{0%,35.1%{opacity:0}36.3%,98%{opacity:1}100%{opacity:0}}
.l6{animation:L6 15s linear infinite}
@keyframes L7{0%,43.5%{opacity:0}44.7%,98%{opacity:1}100%{opacity:0}}
.l7{animation:L7 15s linear infinite}
@keyframes L8{0%,51.8%{opacity:0}53.0%,98%{opacity:1}100%{opacity:0}}
.l8{animation:L8 15s linear infinite}
@keyframes L10{0%,60.1%{opacity:0}61.3%,98%{opacity:1}100%{opacity:0}}
.l10{animation:L10 15s linear infinite}
@keyframes L11{0%,68.5%{opacity:0}69.7%,98%{opacity:1}100%{opacity:0}}
.l11{animation:L11 15s linear infinite}
